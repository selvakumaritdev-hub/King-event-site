<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFB300"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="kLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="kCoconut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
  </defs>

  <!-- Coconut Top -->
  <path d="M80 15 C60 45, 60 70, 80 85 C100 70, 100 45, 80 15 Z" fill="url(#kCoconut)"/>
  
  <!-- Mango Leaves Sprouting -->
  <path d="M80 75 C45 60, 20 40, 10 15 C35 30, 60 50, 80 75 Z" fill="url(#kLeaf)"/>
  <path d="M80 75 C115 60, 140 40, 150 15 C125 30, 100 50, 80 75 Z" fill="url(#kLeaf)"/>
  <path d="M80 75 C55 45, 45 25, 40 5 C60 25, 75 50, 80 75 Z" fill="url(#kLeaf)"/>
  <path d="M80 75 C105 45, 115 25, 120 5 C100 25, 85 50, 80 75 Z" fill="url(#kLeaf)"/>

  <!-- Kalash Pot (Kumbham) -->
  <ellipse cx="80" cy="85" rx="35" ry="8" fill="url(#kGold)"/>
  <path d="M50 85 L45 100 Q 20 130, 45 165 Q 80 185, 115 165 Q 140 130, 115 100 L110 85 Z" fill="url(#kGold)"/>
  
  <!-- Sacred Thread / Swastika / Auspicious Motif on Pot -->
  <path d="M45 130 Q 80 145, 115 130" stroke="#B71C1C" stroke-width="4" fill="none"/>
  <path d="M80 110 L80 150 M60 130 L100 130" stroke="#B71C1C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="120" r="2.5" fill="#B71C1C"/>
  <circle cx="90" cy="120" r="2.5" fill="#B71C1C"/>
  <circle cx="70" cy="140" r="2.5" fill="#B71C1C"/>
  <circle cx="90" cy="140" r="2.5" fill="#B71C1C"/>

  <!-- Base Pedestal -->
  <ellipse cx="80" cy="175" rx="36" ry="9" fill="url(#kGold)"/>
  <path d="M44 175 L40 188 L120 188 L116 175 Z" fill="url(#kGold)"/>
  <ellipse cx="80" cy="188" rx="44" ry="10" fill="url(#kGold)"/>
</svg>
