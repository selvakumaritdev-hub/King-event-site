<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#FDF8F0"/>
    </linearGradient>
    <linearGradient id="marigoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Main Hanging Rope / Floral String -->
  <path d="M0 20 Q 150 45, 300 20 Q 450 45, 600 20 Q 750 45, 900 20 Q 1050 45, 1200 20" stroke="url(#goldGrad)" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M0 25 Q 150 50, 300 25 Q 450 50, 600 25 Q 750 50, 900 25 Q 1050 50, 1200 25" stroke="url(#marigoldGrad)" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

  <!-- Mango Leaves Thoranam Units -->
