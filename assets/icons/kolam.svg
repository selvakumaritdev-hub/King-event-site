<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="kolamGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#AA771C" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <g stroke="url(#kolamGold)" stroke-width="2">
    <!-- Concentric Rings -->
    <circle cx="200" cy="200" r="180" stroke-dasharray="4 6"/>
    <circle cx="200" cy="200" r="150"/>
    <circle cx="200" cy="200" r="110" stroke-dasharray="6 4"/>
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="25"/>
    <circle cx="200" cy="200" r="8" fill="#FFC107"/>

    <!-- 8 Petal Lotus Geometry -->
    <path d="M200 90 Q 240 140, 200 190 Q 160 140, 200 90 Z" fill="none"/>
    <path d="M200 310 Q 240 260, 200 210 Q 160 260, 200 310 Z" fill="none"/>
    <path d="M90 200 Q 140 240, 190 200 Q 140 160, 90 200 Z" fill="none"/>
    <path d="M310 200 Q 260 240, 210 200 Q 260 160, 310 200 Z" fill="none"/>

    <!-- Diagonal Petals -->
    <path d="M122 122 Q 175 145, 190 190 Q 145 175, 122 122 Z" fill="none"/>
    <path d="M278 122 Q 225 145, 210 190 Q 255 175, 278 122 Z" fill="none"/>
    <path d="M122 278 Q 175 255, 190 210 Q 145 225, 122 278 Z" fill="none"/>
    <path d="M278 278 Q 225 255, 210 210 Q 255 225, 278 278 Z" fill="none"/>

    <!-- Outer Decorative Curves (Kolam loops) -->
    <circle cx="200" cy="30" r="10"/>
    <circle cx="200" cy="370" r="10"/>
    <circle cx="30" cy="200" r="10"/>
    <circle cx="370" cy="200" r="10"/>
    <circle cx="80" cy="80" r="8"/>
    <circle cx="320" cy="80" r="8"/>
    <circle cx="80" cy="320" r="8"/>
    <circle cx="320" cy="320" r="8"/>
  </g>
</svg>
